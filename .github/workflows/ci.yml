name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -m "not network"

  docker:
    # The image Render deploys; checked here because it is not built locally.
    # Render auto-deploys main only after these checks pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t aurora-forecast .
      - name: Smoke test
        run: |
          docker run -d --name app -p 7860:7860 -e SCHEDULER=0 aurora-forecast
          for i in $(seq 1 30); do curl -sf localhost:7860/health && exit 0; sleep 2; done
          docker logs app
          exit 1

