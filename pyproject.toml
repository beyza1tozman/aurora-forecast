[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-forecast"
version = "0.1.0"
description = "Aurora visibility forecast for Germany/Europe: Kp forecasting from L1 solar wind."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "scipy>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "psycopg[binary]>=3.2",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
notebooks = [
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "nbconvert>=7",
]

[tool.setuptools.packages.find]
include = ["aurora*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "network: tests that call live external APIs (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# scripts set OPENBLAS_NUM_THREADS before importing numpy
"scripts/*" = ["E402"]
